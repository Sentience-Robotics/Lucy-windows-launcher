name: Build Windows launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish application
        run: >
          dotnet publish LucyWindowsLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      - name: Rename executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path publish -Filter *.exe | Select-Object -First 1
          if ($null -eq $executable) {
            throw "The published executable was not found."
          }
          Rename-Item -Path $executable.FullName -NewName "Lucy.exe"

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\Lucy.exe")) {
            throw "Lucy.exe was not found after publishing."
          }

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "Lucy $tag" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create the GitHub release."
            }
          }

          gh release upload $tag publish\Lucy.exe --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload Lucy.exe to the GitHub release."
          }
